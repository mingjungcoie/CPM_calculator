  <path d="M1080 1080 C1110 970, 1180 880, 1310 820 C1480 740, 1600 650, 1680 560 C1730 505, 1785 470, 1860 455"
        stroke="#e7c7a6" stroke-width="150" stroke-linecap="round" fill="none" opacity="0.95"/>

