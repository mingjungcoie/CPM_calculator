    <path d="M1726 646 C1730 668, 1734 695, 1738 720" stroke="#16324a" stroke-width="12" stroke-linecap="round"/>
    <rect x="1700" y="654" width="18" height="20" rx="6" fill="#1b3b55" opacity="0.95"/>
  </g>

  <!-- A minimal airplane silhouette (subtle adventure cue) -->
  <g opacity="0.28" transform="translate(1190 210) rotate(-10)">
    <path d="M0 22 L210 0 L226 10 L120 30 L230 72 L215 86 L105 48 L70 55 L55 78 L40 83 L44 54 L0 22 Z"
