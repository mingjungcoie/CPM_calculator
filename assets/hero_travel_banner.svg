<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="ÅL¦G’ª;–ºkE">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6aa9d8"/>
      <stop offset="55%" stop-color="#8dc9e8"/>
      <stop offset="100%" stop-color="#d7f3ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2db7c6"/>
      <stop offset="55%" stop-color="#36c6b2"/>
      <stop offset="100%" stop-color="#4ed9c6"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="72%" cy="26%" r="38%">
      <stop offset="0%" stop-color="#fff4c6" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#ffd9a3" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd9a3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e5568"/>
      <stop offset="100%" stop-color="#173a4b"/>
    </linearGradient>
    <linearGradient id="island" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d6f4b"/>
      <stop offset="100%" stop-color="#1f5237"/>
    </linearGradient>
    <linearGradient id="boardwalk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b98a5a"/>
      <stop offset="100%" stop-color="#8b5a36"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#caa57d"/>
      <stop offset="100%" stop-color="#8f6a45"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0b2a3b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#sunGlow)"/>

