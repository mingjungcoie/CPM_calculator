<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>每哩成本（CPM）計算機｜台幣版</title>
  <style>
    :root {
      --bg: #f3f5f8;
      --card: #ffffff;
      --text: #1a2332;
      --muted: #5c6678;
      --brand: #1f4f7a;
      --brand-dark: #163a5a;
      --line: #e2e8f0;
      --ok: #1d7048;
      --warn: #9a6700;
      --bad: #a3334a;
    }

    * {
      box-sizing: border-box;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: 18px 16px 28px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      color: #f8fafc;
      padding: 78px 22px 64px;
      margin-bottom: 16px;
      border: 1px solid rgba(15, 23, 42, 0.12);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.18);
      background:
        linear-gradient(180deg, rgba(15, 23, 42, 0.30) 0%, rgba(15, 23, 42, 0.55) 78%, rgba(15, 23, 42, 0.62) 100%),
        url("assets/hero_reference.png");
      background-size: cover;
      background-position: center;
      text-align: center;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 34px;
      letter-spacing: 0.5px;
      line-height: 1.15;
      text-shadow: 0 10px 22px rgba(0, 0, 0, 0.35);
    }

    .hero p {
      margin: 0;
      opacity: 0.92;
      line-height: 1.6;
      font-size: 14px;
      max-width: 560px;
      margin-left: auto;
      margin-right: auto;
      text-shadow: 0 10px 22px rgba(0, 0, 0, 0.30);
    }

    .hero .kicker {
      display: inline-block;
      margin-bottom: 14px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(15, 23, 42, 0.22);
      backdrop-filter: blur(8px);
      font-weight: 700;
      letter-spacing: 0.8px;
      font-size: 12px;
      text-transform: uppercase;
    }

    .card {
      background: var(--card);
      border-radius: 10px;
      border: 1px solid var(--line);
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: 0 1px 3px rgba(26, 35, 50, 0.06);
    }

    h2 {
      margin: 0 0 14px;
      font-size: 20px;
      color: var(--text);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      font-size: 18px;
      color: #243d5e;
    }

    .badge {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      background: #2d5382;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fafbfc;
      gap: 8px;
    }

    .prefix,
    .suffix {
      color: var(--muted);
      font-weight: 700;
      white-space: nowrap;
    }

    input[type="number"] {
      border: 0;
      outline: 0;
      width: 100%;
      font-size: 22px;
      color: var(--text);
      background: transparent;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--brand);
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #7a7a7a;
      margin-top: 6px;
    }

    .value-box {
      margin-top: 8px;
      font-size: 16px;
      font-weight: 700;
      color: var(--brand);
    }

    .actions {
      margin-top: 6px;
      display: grid;
      gap: 10px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 14px;
      background: var(--brand);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.08s ease;
    }

    button:hover {
      background: var(--brand-dark);
    }

    button:active {
      transform: translateY(1px);
    }

    .result {
      margin-top: 12px;
      border: 1px solid var(--line);
      background: #fafbfc;
      border-radius: 10px;
      padding: 14px;
      line-height: 1.6;
    }

    .kpi {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }

    .mile-worth {
      margin-top: 6px;
      font-weight: 600;
      color: var(--muted);
    }

    .score {
      font-weight: 800;
    }

    .score.good {
      color: var(--ok);
    }

    .score.ok {
      color: var(--warn);
    }

    .score.bad {
      color: var(--bad);
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="hero">
      <div class="kicker">Next journey starts now</div>
      <h1>每哩成本（CPM）計算機</h1>
      <p>用最短的時間，算出這張哩程票的「每哩價值」與 CPM。<br />帶上好心情，下一段旅程出發。</p>
    </section>

    <section class="card">
      <h3 class="section-title"><span class="badge">1</span> 現金票價（含稅）</h3>
      <div class="field">
        <label for="cashPrice">機票總現金價 <span class="hint">（你若直接購票需支付的總額）</span></label>
        <div class="input-wrap">
          <span class="prefix">NT$</span>
          <input id="cashPrice" type="number" min="0" value="10000" />
          <span class="suffix">元</span>
        </div>
      </div>
    </section>

    <section class="card">
      <h3 class="section-title"><span class="badge">2</span> 哩數換票資訊</h3>
      <div class="field">
        <label for="milesNeeded">所需哩數 <span class="hint">（兌換這張機票要扣的哩程）</span></label>
        <div class="input-wrap">
          <input id="milesNeeded" type="number" min="1" value="26000" />
          <span class="suffix">哩</span>
        </div>
      </div>

      <div class="field">
        <label for="taxFee">兌換時仍需支付稅費 <span class="hint">（機場稅、燃油費等）</span></label>
        <div class="input-wrap">
          <span class="prefix">NT$</span>
          <input id="taxFee" type="number" min="0" value="1200" />
          <span class="suffix">元</span>
        </div>
      </div>
    </section>

    <section class="card">
      <h3 class="section-title"><span class="badge">3</span> 你對每哩價值的估值</h3>
      <div class="field">
        <label for="targetValue">每哩估值</label>
        <input id="targetValue" type="range" min="0.2" max="2.5" value="0.8" step="0.01" />
        <div class="range-labels">
          <span>NT$0.20</span>
          <span>NT$1.00</span>
          <span>NT$2.50</span>
        </div>
        <div class="value-box">目前估值：<span id="targetValueText">NT$0.80 / 哩</span></div>
      </div>
    </section>

    <div class="actions">
      <button id="calculateBtn">計算 CPM</button>
    </div>

    <section id="result" class="result" aria-live="polite">
      <div>填入資料後按「計算 CPM」。</div>
    </section>
  </main>

  <script>
    const cashPriceInput = document.getElementById("cashPrice");
    const milesNeededInput = document.getElementById("milesNeeded");
    const taxFeeInput = document.getElementById("taxFee");
    const targetValueInput = document.getElementById("targetValue");
    const targetValueText = document.getElementById("targetValueText");
    const calculateBtn = document.getElementById("calculateBtn");
    const resultBox = document.getElementById("result");

    const fmtTwd = (n) => `NT$${Number(n).toLocaleString("zh-Hant-TW", { maximumFractionDigits: 0 })}`;
    const fmt2 = (n) => Number(n).toLocaleString("zh-Hant-TW", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function updateTargetText() {
      targetValueText.textContent = `NT$${fmt2(targetValueInput.value)} / 哩`;
    }

    function calc() {
      const cashPrice = Number(cashPriceInput.value);
      const milesNeeded = Number(milesNeededInput.value);
      const taxFee = Number(taxFeeInput.value);
      const targetValue = Number(targetValueInput.value);

      if (!cashPrice || !milesNeeded || milesNeeded <= 0 || cashPrice < 0 || taxFee < 0) {
        resultBox.innerHTML = "<div>請輸入正確數字（票價、哩數、稅費）。</div>";
        return;
      }

      const netSaved = cashPrice - taxFee;
      const valuePerMile = netSaved / milesNeeded;
      const cpm = valuePerMile * 100;
      const targetGap = valuePerMile - targetValue;

      let verdictClass = "ok";
      let verdict = "普通";
      if (targetGap >= 0.2) {
        verdictClass = "good";
        verdict = "非常划算";
      } else if (targetGap < -0.1) {
        verdictClass = "bad";
        verdict = "不建議兌換";
      }

      resultBox.innerHTML = `
        <div>你用哩程換票後，等效每哩價值為：</div>
        <div class="kpi">NT$${fmt2(valuePerMile)} / 哩（CPM：${fmt2(cpm)}）</div>
        <div class="mile-worth">相當於 1 哩可換到：NT$${fmt2(valuePerMile)}</div>
        <div>現金票價：${fmtTwd(cashPrice)}，扣除兌換仍要付的稅費：${fmtTwd(taxFee)}</div>
        <div>等於你用 ${milesNeeded.toLocaleString("zh-Hant-TW")} 哩換到約 ${fmtTwd(netSaved)} 的價值。</div>
        <div class="score ${verdictClass}">結論：${verdict}</div>
      `;
    }

    targetValueInput.addEventListener("input", updateTargetText);
    calculateBtn.addEventListener("click", calc);
    updateTargetText();
    calc();
  </script>
</body>
</html>
